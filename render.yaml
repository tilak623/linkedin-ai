services:
  - type: web
    name: linkedin-ai-publisher
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_BACKGROUND_SCHEDULER
        value: "false"
      - key: DAILY_POST_TIME
        value: "09:00"
      - key: DAILY_POST_TIMEZONE
        value: Asia/Kolkata
      - key: LINKEDIN_FRONTEND_URL
        value: https://linkedin-ai-publisher.onrender.com
      - key: LINKEDIN_REDIRECT_URI
        value: https://linkedin-ai-publisher.onrender.com/api/v1/linkedin/callback
      - key: DATABASE_URL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: SCHEDULER_TRIGGER_TOKEN
        generateValue: true
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_TOKEN_ENCRYPTION_KEY
        sync: false
